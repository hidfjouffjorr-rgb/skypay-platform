<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYPAY Platform - Login</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f7fc;color:#333;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
  .container{background:white;width:100%;max-width:400px;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
  h2{text-align:center;color:#2449a7;margin-bottom:20px}
  .form-group{margin-bottom:15px}
  label{display:block;margin-bottom:5px;font-weight:bold;font-size:14px}
  input, select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
  button{width:100%;background:#2449a7;color:white;border:none;padding:12px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
  button:hover{background:#1b3680}
  .info{text-align:center;margin-top:15px;font-size:14px;color:#666}
</style>
</head>
<body>
  <div class="container">
    <h2>SKYPAY Platform</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>মোবাইল নম্বর বা ইমেইল</label>
        <input type="text" placeholder="আপনার নম্বর বা ইমেইল দিন" required>
      </div>
      <div class="form-group">
        <label>পাসওয়ার্ড</label>
        <input type="password" placeholder="পাসওয়ার্ড দিন" required>
      </div>
      <div class="form-group">
        <label>প্যানেল সিলেক্ট করুন</label>
        <select>
          <option value="user">User Panel</option>
          <option value="admin">Admin Panel</option>
        </select>
      </div>
      <button type="submit">লগইন করুন</button>
    </form>
    <div class="info">
      <p>অ্যাকাউন্ট নেই? রেজিস্ট্রেশন করুন</p>
    </div>
  </div>
</body>
</html>
