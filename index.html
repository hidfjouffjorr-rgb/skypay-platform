<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYPAY - লগইন ও রেজিস্ট্রেশন</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #130b2b; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .auth-container { width: 100%; max-width: 420px; background: #1c1438; border: 1px solid #2d2354; border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .logo-box { width: 70px; height: 70px; background: #fff; border-radius: 16px; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #130b2b; font-size: 18px; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
        .auth-title { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .auth-subtitle { font-size: 13px; color: #a5b4fc; margin-bottom: 25px; }

        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
        .input-box { display: flex; align-items: center; background: #130b2b; border: 1px solid #3b2c6e; border-radius: 12px; padding: 4px 12px; }
        .input-box span { color: #94a3b8; font-size: 14px; margin-right: 8px; }
        .input-box input { width: 100%; background: transparent; border: none; outline: none; color: #fff; padding: 10px 0; font-size: 14px; }
        
        .btn-primary { width: 100%; padding: 14px; background: #065f46; border: none; color: white; font-weight: bold; border-radius: 12px; cursor: pointer; font-size: 16px; margin-top: 10px; box-shadow: 0 4px 15px rgba(6,95,70,0.4); transition: 0.2s; }
        .btn-primary:hover { background: #047857; }

        .switch-auth { margin-top: 20px; font-size: 13px; color: #94a3b8; }
        .switch-auth span { color: #38bdf8; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-box">SKY</div>
        <div class="auth-title">SKYPAY</div>
        <div class="auth-subtitle">আপনাকে স্বাগতম</div>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="form-group">
                <label>ফোন নম্বর</label>
                <div class="input-box">
                    <span>🇧🇩 +88</span>
                    <input type="text" id="loginPhone" placeholder="01XXX XXXXXX">
                </div>
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <div class="input-box">
                    <input type="password" id="loginPass" placeholder="আপনার পাসওয়ার্ড লিখুন">
                </div>
            </div>
            <button class="btn-primary" onclick="handleLogin()">লগ ইন</button>
            <div class="switch-auth">একাউন্ট নেই? <span onclick="toggleAuth(true)">সাইন আপ</span></div>
        </div>

        <!-- Register Form (Hidden by default) -->
        <div id="registerForm" style="display: none;">
            <div class="form-group">
                <label>ফোন নম্বর</label>
                <div class="input-box">
                    <span>🇧🇩 +88</span>
                    <input type="text" id="regPhone" placeholder="01XXX XXXXXX">
                </div>
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <div class="input-box">
                    <input type="password" id="regPass" placeholder="পাসওয়ার্ড দিন">
                </div>
            </div>
            <div class="form-group">
                <label>আমন্ত্রণ কোড • ঐচ্ছিক</label>
                <div class="input-box">
                    <input type="text" id="regRef" placeholder="রেফারেল কোড">
                </div>
            </div>
            <button class="btn-primary" onclick="handleRegister()">সাইন আপ</button>
            <div class="switch-auth">আগে থেকেই একাউন্ট আছে? <span onclick="toggleAuth(false)">লগ ইন</span></div>
        </div>
    </div>

    <script>
        function toggleAuth(isReg) {
            document.getElementById('loginForm').style.display = isReg ? 'none' : 'block';
            document.getElementById('registerForm').style.display = isReg ? 'block' : 'none';
        }

        function handleLogin() {
            const phone = document.getElementById('loginPhone').value;
            if(!phone) { alert('দয়া করে ফোন নম্বর দিন!'); return; }
            localStorage.setItem('userPhone', phone);
            window.location.href = 'dashboard.html';
        }

        function handleRegister() {
            const phone = document.getElementById('regPhone').value;
            if(!phone) { alert('দয়া করে সঠিক তথ্য দিন!'); return; }
            localStorage.setItem('userPhone', phone);
            alert('সফলভাবে রেজিস্ট্রেশন সম্পন্ন হয়েছে!');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
