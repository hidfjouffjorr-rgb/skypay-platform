<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYPAY Password Hash</title>
<script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
</head>
<body>
<h2>SKYPAY Admin Hash Generator</h2>
<input id="pass" type="password" placeholder="Enter new password">
<button onclick="generate()">Generate Hash</button>
<p id="status"></p>
<textarea id="result" rows="4" style="width:100%"></textarea>
<button onclick="copyHash()">Copy Hash</button>

<script>
async function generate() {
  const password = document.getElementById("pass").value;
  if (!password) {
    alert("Enter your password");
    return;
  }
  if (!window.dcodeIO || !dcodeIO.bcrypt) {
    document.getElementById("status").textContent =
      "Library not loaded. Refresh and try again.";
    return;
  }
  const hash = dcodeIO.bcrypt.hashSync(password, 10);
  document.getElementById("result").value = hash;
  document.getElementById("status").textContent = "Hash generated.";
}
function copyHash() {
  const result = document.getElementById("result");
  result.select();
  document.execCommand("copy");
  alert("Hash copied");
}
</script>
</body>
</html>
