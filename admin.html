<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYPAY - এডমিন কন্ট্রোল প্যানেল</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #071124; color: #f8fafc; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; outline: none; font-size: 14px; }
        .save-btn { width: 100%; padding: 12px; background: #2563eb; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; font-size: 15px; }
        .save-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛠️ SKYPAY এডমিন প্যানেল</h2>
        
        <div class="form-group">
            <label>বিকাশ নম্বর (Personal)</label>
            <input type="text" id="adminBkash" placeholder="যেমন: 01700000000">
        </div>

        <div class="form-group">
            <label>নগদ নম্বর (Personal)</label>
            <input type="text" id="adminNagad" placeholder="যেমন: 01800000000">
        </div>

        <div class="form-group">
            <label>সর্বনিম্ন ডিপোজিট (টাকা)</label>
            <input type="number" id="adminMinDep" placeholder="যেমন: 300">
        </div>

        <div class="form-group">
            <label>সর্বনিম্ন উইথড্র (টাকা)</label>
            <input type="number" id="adminMinWd" placeholder="যেমন: 500">
        </div>

        <div class="form-group">
            <label>ভিআইপি প্যাকেজের নাম</label>
            <input type="text" id="adminPkgName" placeholder="যেমন: VIP Starter">
        </div>

        <div class="form-group">
            <label>প্যাকেজের মেয়াদ (দিন)</label>
            <input type="number" id="adminPkgDuration" placeholder="যেমন: 30">
        </div>

        <button class="save-btn" onclick="saveAdminSettings()">সব পরিবর্তন সেভ করুন</button>
    </div>

    <script>
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                if(data.success && data.settings) {
                    const s = data.settings;
                    document.getElementById('adminBkash').value = s.bkash || '';
                    document.getElementById('adminNagad').value = s.nagad || '';
                    document.getElementById('adminMinDep').value = s.min_deposit || '';
                    document.getElementById('adminMinWd').value = s.min_withdraw || '';
                    document.getElementById('adminPkgName').value = s.package_name || '';
                    document.getElementById('adminPkgDuration').value = s.package_duration || '';
                }
            } catch(e) {
                console.error("ডেটা লোড করতে সমস্যা হয়েছে");
            }
        }

        async function saveAdminSettings() {
            const settings = {
                bkash: document.getElementById('adminBkash').value,
                nagad: document.getElementById('adminNagad').value,
                min_deposit: document.getElementById('adminMinDep').value,
                min_withdraw: document.getElementById('adminMinWd').value,
                package_name: document.getElementById('adminPkgName').value,
                package_duration: document.getElementById('adminPkgDuration').value
            };

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                const data = await res.json();
                alert(data.message || 'সফলভাবে সেভ হয়েছে!');
            } catch(e) {
                alert('সেভ করতে সমস্যা হয়েছে।');
            }
        }

        loadSettings();
    </script>
</body>
</html>
